---
name: Drupal Data Puppeteer Scenario
author: Marco Villegas <marco.villegas@adaptagency.com>
description: Drupal sample with pre-populated DB (pages and plugins) where a simple Puppeteer flow is executed

compose-file: !include compose.yml

ignore-unsupported-compose: True

services:
  drupal-mariadb:
    ports:
      - 3306:3306
# mariadb only starts listening on 3306 once docker-entrypoint-initdb.d (which imports drupal.sql)
# has fully completed, so a successful ping also guarantees the seed data is loaded.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psomedrupal"]
      interval: "1h" # effectively turns repeated healthchecks during runtime off
      start_period: "60s"
      start_interval: "1s"
    networks:
      - drupal-mariadb-network
  drupal-apache:
    ports:
      - 9875:9875
    networks:
      - drupal-mariadb-network
    folder-destination: "/tmp/repo"
  gcb-puppeteer:
    image: greencoding/puppeteer-chrome
    setup-commands:
      - command: cp /tmp/repo/drupal/puppeteer-flow.js /var/www/puppeteer-flow.js
    networks:
      - drupal-mariadb-network

flow:
  - name: Check Website
    container: gcb-puppeteer
    commands:
      - type: console
        command: node /var/www/puppeteer-flow.js
        note: Starting Puppeteer Flow
        read-notes-stdout: true
        log-stdout: true
      - type: console
        command: sleep 30
        note: Idling
      - type: console
        command: node /var/www/puppeteer-flow.js
        note: Starting Puppeteer Flow again
        read-notes-stdout: true
        log-stdout: true

networks:
  drupal-mariadb-network:
